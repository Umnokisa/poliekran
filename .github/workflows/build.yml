name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $v = "$(([xml](Get-Content src/Poliekran.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build DLL
        run: dotnet build src -c Release -o out -p:Version=${{ steps.ver.outputs.version }}

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $m = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $m) { $m = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $m /V2 "/DVER=${{ steps.ver.outputs.version }}" installer\setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: Poliekran-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            out/Poliekran.dll

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Poliekran-${{ needs.build.outputs.version }}
          path: art

      - uses: softprops/action-gh-release@v2
        with:
          files: art/dist/*.exe
          generate_release_notes: true
